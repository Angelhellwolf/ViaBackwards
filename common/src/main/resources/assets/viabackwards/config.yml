# 如需帮助，可加入我们的 Discord - https://viaversion.com/discord
#
# 始终显示已映射生物的原始名称，而不是只在光标悬停时显示。
always-show-original-mob-name: true
#
# 将自定义附魔的名称和等级写入物品 lore。
# 如果你看到条目重复，或自定义附魔插件已经手动写入 lore，请设为 false。
add-custom-enchants-into-lore: true
#
# 为 1.12 客户端在 1.13+ 服务器上把计分板队伍颜色追加到前缀之后。
add-teamcolor-to-prefix: true
#
# 为 1.12- 玩家转换 1.13 的面向玩家数据包。需要额外缓存。
fix-1_13-face-player: false
#
# 修复 1.13 及更低客户端看不到背包标题颜色或格式的问题，会将其转换为旧版文本。
# 如果可翻译文本显示错误，请禁用此项。
fix-formatted-inventory-titles: true
#
# 向低于 1.17 的客户端发送背包确认包，用作 ping 包替代。
# 仅对 short 范围内的 ID 生效。适合反作弊兼容。
handle-pings-as-inv-acknowledgements: false
#
# 为低于 1.17 的客户端在 y=0 添加基岩方块。由于发送的是假方块，可能导致奇怪交互。
bedrock-at-y-0: false
#
# 在 1.19+ 服务器上，把幽匿尖啸体显示为哭泣的黑曜石给 1.18.2 客户端。这会修复碰撞和方块破坏问题。
# 禁用时，客户端会把它们看作末地传送门框架。
sculk-shriekers-to-crying-obsidian: true
#
# 在 1.14+ 服务器上，把脚手架显示为水给 1.13.2 客户端。这会修复碰撞问题。
# 禁用时，客户端会把它们看作干草块。
scaffolding-to-water: false
#
# 在 1.19+ 服务器上，将黑暗效果映射为失明给 1.18.2 客户端。
map-darkness-effect: true
#
# 启用后，1.21.3 客户端会把 1.21.4+ 自定义模型数据的第一个 float 接收为 int。若你自己处理了此变更，请禁用。
map-custom-model-data: true
#
# 启用后，1.19.3 客户端会在 1.19.4+ 服务器上把展示实体接收为带自定义实体数据的盔甲架。注意：
# 这不支持展示实体提供的全部功能。
map-display-entities: true
#
# 抑制某些不支持功能缺少模拟时的警告（例如 1.17+ 世界高度）。
suppress-emulation-warnings: false
#
# 启用后，1.21.5 客户端在 1.21.6+ 服务器上会通过箱子界面显示对话。
dialogs-via-chests: true
#
# 对话样式。这里也可以使用翻译键。
dialog-style:
  page-navigation-title: "&9&l页面导航"
  page-navigation-next: "&9左键：&6前往下一页"
  page-navigation-previous: "&9右键：&6返回上一页"
  toggle-value: "&9左键：&6切换数值"
  increase-value: "&9左键：&6增加 %s"
  decrease-value: "&9右键：&6减少 %s"
  value-range: "&7（数值范围：&a%s &7到 &a%s&7）"
  current-value: "&7当前值：&a%s"
  edit-value: "&9左键：&6编辑文本"
  next-option: "&9左键：&6前往下一个选项"
  previous-option: "&9右键：&6返回上一个选项"
  set-text: "&9左键/关闭：&6设置文本"
  close: "&9左键：&6关闭"
#
# 启用后，1.21.7 客户端在 1.21.9+ 服务器上会通过对话显示行为准则。
# 注意：由于配置阶段暂不支持对话，目前不支持低于 1.21.6 的客户端。
code-of-conduct-as-dialog: true
#
# 将原版 1.21.4+ 物品名传入 custom_model_data 字符串。
# 这允许客户端资源包完整还原此旧版本缺失的新物品外观。
# 如果你的服务器使用现代物品作为基础创建自定义物品，请禁用。
# 提示：服务器自定义物品应基于 1.21.4 之前已有的物品（例如鞍），以确保兼容性。
pass-original-item-name-to-resource-packs: true
